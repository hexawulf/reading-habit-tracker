name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR builds; never cancel a main build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install server dependencies
        run: npm ci --ignore-scripts
      - name: Build native modules
        run: npm rebuild bcrypt
      - name: Lint
        run: npm run lint
      - name: Server tests
        run: npm test

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Client tests
        working-directory: client
        run: npm test
      - name: Build client
        working-directory: client
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install server dependencies
        run: npm ci --ignore-scripts
      - name: Build native modules
        run: npm rebuild bcrypt
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client (E2E placeholder Firebase config)
        working-directory: client
        env:
          # Non-secret placeholder web config so the SPA mounts without a real
          # Firebase project. The E2E suite is guest-only and never signs in.
          REACT_APP_FIREBASE_API_KEY: AIzaE2E-placeholder-not-real-key
          REACT_APP_FIREBASE_AUTH_DOMAIN: mybooks-e2e-fake.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: mybooks-e2e-fake
          REACT_APP_FIREBASE_STORAGE_BUCKET: mybooks-e2e-fake.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          REACT_APP_FIREBASE_APP_ID: "1:000000000000:web:e2eplaceholder"
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        run: npm run test:e2e

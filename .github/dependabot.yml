# Dependabot configuration for reading-habit-tracker (mybooks).
# Weekly grouped minor/patch PRs for the server, the client, and GitHub Actions.
version: 2
updates:
  # Server (root) npm dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Client (Vite + React) npm dependencies.
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI workflow (all grouped together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
